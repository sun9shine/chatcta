version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: chatcta-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=chatcta
    networks:
      - chatcta-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatcta-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/chatcta
      - JWT_SECRET=${JWT_SECRET:-chatcta_super_secret_change_in_production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@chatcta.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@12345}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - FB_VERIFY_TOKEN=${FB_VERIFY_TOKEN:-chatcta_verify_2024}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - chatcta-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-/api}
    container_name: chatcta-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - chatcta-net

  nginx:
    image: nginx:alpine
    container_name: chatcta-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - frontend
      - backend
    networks:
      - chatcta-net

volumes:
  mongo_data:
  uploads_data:

networks:
  chatcta-net:
    driver: bridge
